name: Agent Workflow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Raised from 20: source:compile alone runs a real install and build per framework
    # (~4.5 min locally) and build:web builds three preview bundles plus vite and tsc.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `version` key on purpose. pnpm/action-setup errors with "Multiple versions of pnpm
        # specified" when the action config and the package.json `packageManager` field both
        # declare a version, so packageManager is the single source of truth and Corepack pins
        # CI to the exact pnpm the lockfile was resolved with.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint gate (correctness rules are errors)
        run: pnpm lint
      - name: Unit tests with the coverage threshold gate
        run: pnpm test:coverage
      - name: Standalone native-package typecheck
        run: pnpm exec tsc --noEmit -p packages/ui-native/tsconfig.json
      - run: pnpm test
      # The PR gate previously never built the app, so a break in fumadocs-mdx, the preview
      # bundles, vite build, or the docs tsconfig merged green and only failed at release time.
      # These three also stop the path-filtered source-distribution workflow from being the only
      # place the published surface is proven: a PR touching only apps/** or docs/** previously
      # ran none of them.
      - name: Build the app
        run: pnpm build:web
      - name: Verify the published source surface
        run: pnpm source:smoke
      - name: Compile the shipped consumer starters
        run: pnpm source:compile
      - name: Preview the actual PR range
        if: github.event_name == 'pull_request'
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm agent check --base "$REVIEW_BASE" --plan --json
      - name: Verify all discovered workspace consumers
        run: pnpm agent check --all --timeout 180000
      - run: pnpm workflow:check --strict-budget
      - run: pnpm docs:check
      - run: bash .agents/scripts/skill.sh check

  windows-foundation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `version` key on purpose. pnpm/action-setup errors with "Multiple versions of pnpm
        # specified" when the action config and the package.json `packageManager` field both
        # declare a version, so packageManager is the single source of truth and Corepack pins
        # CI to the exact pnpm the lockfile was resolved with.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm foundation:typecheck
      - run: pnpm foundation:test
      - name: Real Windows workspace discovery
        run: pnpm agent check --all --plan --json
