name: Source distribution
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/*source*'
      - 'package.json'
      - '.github/workflows/source-distribution.yml'
  push:
    branches: ['main']
    paths:
      - 'packages/**'
      - 'scripts/*source*'
      - 'package.json'
      - '.github/workflows/source-distribution.yml'
permissions:
  contents: read
concurrency:
  group: source-distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install build-only TypeScript without installing runtime workspace packages
        run: |
          npm install --prefix .source-ci --ignore-scripts --no-audit --no-fund typescript@5.8.3
          mkdir -p node_modules
          ln -s ../.source-ci/node_modules/typescript node_modules/typescript
      - run: node --test packages/cli/test/source.test.mjs packages/cli/test/source-regressions.test.mjs
      - run: node scripts/build-source-registry.mjs
      - run: node scripts/check-source-distribution.mjs
      # Generated projects are installed and built here, which the check above only
      # generates. Needs no workspace packages, so it fits this job's slim install.
      - run: node scripts/check-source-compilation.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universal-source-cli
          path: dist/universal-cli
