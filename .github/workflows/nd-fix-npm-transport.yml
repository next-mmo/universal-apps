name: Fix npm resource transport (migration only)

on:
  push:
    branches: [feat/standalone-nd-workflow]
    paths: [.github/workflows/nd-fix-npm-transport.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'next-mmo/universal-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Apply explicit transport mapping
        run: |
          python .github/nd-fix-npm-transport.py
          python - <<'PY'
          from pathlib import Path
          import ast
          root = Path('packages/nd-workflow')
          file = root / 'scripts/validate.py'
          text = file.read_text()
          old = '                or ".gitignore" not in files or "gitignore.template" in files):'
          new = '''                or ".gitignore" not in files
                          or any(isinstance(name, str) and name != ".gitignore"
                                 and name.casefold() in (".gitignore", "gitignore.template")
                                 for name in files)):'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          ast.parse(text)
          file.write_text(text)
          file = root / 'scripts/package_npm.py'
          text = file.read_text().replace("    if 'gitignore.template' in entries:",
                                         "    if any(name.casefold() == 'gitignore.template' for name in entries):")
          ast.parse(text)
          file.write_text(text)
          file = root / 'tests/test_standalone_package.py'
          text = file.read_text()
          old = "            manifest = json.loads(original)\n            manifest['source_paths'] = {'.gitignore': '../outside'}"
          new = """            from validate import load_manifest
                      for collision in ('.GITIGNORE', 'GitIgnore.template'):
                          manifest = json.loads(original)
                          manifest['files'].append(collision)
                          manifest_path.write_text(json.dumps(manifest))
                          self.assertIn('invalid npm source-path mapping', load_manifest(self.package)[1])
                      manifest = json.loads(original)
                      manifest['source_paths'] = {'.gitignore': '../outside'}"""
          # Dedent the replacement's continuation lines to the method's try block.
          new = new.replace('\n                      ', '\n            ')
          assert text.count(old) == 1
          text = text.replace(old, new)
          ast.parse(text)
          file.write_text(text)
          PY
      - name: Keep source validation, safety regressions, and installed CLI checks
        working-directory: packages/nd-workflow
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/launcher.test.mjs
      - name: Commit validated fix and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/nd-fix-npm-transport.py .github/workflows/nd-fix-npm-transport.yml
          git add -- packages/nd-workflow/scripts/validate.py packages/nd-workflow/scripts/core_export.py packages/nd-workflow/scripts/package.py packages/nd-workflow/scripts/package_npm.py packages/nd-workflow/tests/test_standalone_package.py packages/nd-workflow/STANDALONE.md packages/nd-workflow/package.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(nd): preserve required ignore resource through npm installation' -m 'Use an explicit and validated transport filename mapping, restore canonical source names on export, and exercise the npm-installed nd init command. Original source manifests still require .gitignore. Full Python and launcher regression suites passed before this commit.'
          git push origin HEAD:refs/heads/feat/standalone-nd-workflow
