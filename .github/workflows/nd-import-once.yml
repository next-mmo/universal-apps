name: Finalize standalone ND package (migration only)

on:
  push:
    branches: [feat/standalone-nd-workflow]
    paths: [.github/workflows/nd-import-once.yml]

permissions:
  contents: write

concurrency:
  group: nd-source-import
  cancel-in-progress: false

jobs:
  finish:
    if: github.repository == 'next-mmo/universal-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Wire package without changing its generic core
        run: python .github/nd-package-migration.py
      - name: Validate and exercise the independent artifact
        run: |
          python packages/nd-workflow/scripts/validate.py
          node --test packages/nd-workflow/tests/launcher.test.mjs
          python -m unittest discover -s packages/nd-workflow/tests -p 'test_standalone_package.py' -v
      - name: Commit scoped wiring and remove migration helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/nd-import-once.yml .github/nd-package-migration.py
          git add -- packages/nd-workflow/package.json packages/nd-workflow/IMPORT.json packages/nd-workflow/package-files.json packages/nd-workflow/README.md package.json pnpm-lock.yaml README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(nd): wire independent package and remove import helpers' -m 'Standalone artifact checks passed on the migration runner. Full regression and platform coverage remain the separate ND CI gate. No publication, main merge, or host policy adoption.'
          git push origin HEAD:refs/heads/feat/standalone-nd-workflow
