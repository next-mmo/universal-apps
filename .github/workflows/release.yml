name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run release without publishing'
        required: false
        default: 'true'

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm source:smoke

  publish-npm:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Build Universal CLI
        run: |
          pnpm source:build
          pnpm source:smoke
      - name: Build ND Workflow
        working-directory: packages/nd-workflow
        run: |
          python scripts/validate.py
          python scripts/package_npm.py --output artifacts/nd-workflow.tgz
      - name: Publish @next-mmo/universal-cli
        if: github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish ./dist/universal-cli --access public
          else
            echo "Skipping publish: NPM_TOKEN not set"
          fi
      - name: Publish @next-mmo/nd-workflow
        if: github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish ./packages/nd-workflow/artifacts/nd-workflow.tgz --access public
          else
            echo "Skipping publish: NPM_TOKEN not set"
          fi
