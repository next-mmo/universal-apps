name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run release without publishing'
        required: false
        default: 'true'

# Least privilege is granted per job: only the publish job talks to the registry, and only it holds
# the OIDC token that npm provenance would consume.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        # No `version` key on purpose. pnpm/action-setup errors with "Multiple versions of pnpm
        # specified" when the action config and the package.json `packageManager` field both
        # declare a version, so packageManager is the single source of truth and Corepack pins
        # the publishing toolchain to the exact pnpm the lockfile was resolved with.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A release must clear every gate a pull request clears, plus the release-only checks.
      - name: Lint gate (correctness rules are errors)
        run: pnpm lint
      - name: Unit tests with the coverage threshold gate
        run: pnpm test:coverage
      - run: pnpm test
      - name: Verify all discovered workspace consumers
        run: pnpm agent check --all --timeout 180000
      - run: pnpm workflow:check --strict-budget
      - run: pnpm docs:check
      - run: pnpm build:web
      - run: pnpm source:smoke
      # Proves a generated consumer actually compiles, which source:smoke does not.
      # It prints every framework and fails on any framework listed as verified in
      # scripts/check-source-compilation.mjs, so this cannot pass while silently
      # skipping the ones that do not build yet.
      - name: Compile generated consumer starters
        run: pnpm source:compile
      # A tag can name a version that neither published package actually holds. Publishing then
      # pushes an unrelated version under a tag that implies another one, and the two packages
      # can drift apart in a single run. Assert before anything is built or published.
      - name: Tag must match both published package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          nd_version=$(node -p "require('./packages/nd-workflow/package.json').version")
          failed=0
          for entry in "universal-cli:$cli_version" "nd-workflow:$nd_version"; do
            name="${entry%%:*}"
            version="${entry#*:}"
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $name version $version"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Bumping a version means editing the package.json that owns it, then tagging that exact version. Refusing to publish a mismatched release."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches universal-cli@$cli_version and nd-workflow@$nd_version"

  publish-npm:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires a protected `release` environment with required reviewers before this job can publish.
    environment: release
    permissions:
      contents: read
      # Consumed by `npm publish --provenance` below: the registry verifies the published tarball
      # against this workflow run, so a package cannot be attributed to a build that did not
      # produce it. Requires a public repository and an npm plan that supports attestations;
      # if a publish fails with a provenance error, that precondition is the first thing to check.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        # No `version` key on purpose. pnpm/action-setup errors with "Multiple versions of pnpm
        # specified" when the action config and the package.json `packageManager` field both
        # declare a version, so packageManager is the single source of truth and Corepack pins
        # the publishing toolchain to the exact pnpm the lockfile was resolved with.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Build Universal CLI
        run: |
          pnpm source:build
          pnpm source:smoke
      - name: Build ND Workflow
        working-directory: packages/nd-workflow
        run: |
          python scripts/validate.py
          python scripts/package_npm.py --output artifacts/nd-workflow.tgz
      - name: Publish @next-mmo/universal-cli
        if: github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set, so this release cannot publish. A tag push or a non-dry-run dispatch is a real release intent; refusing to report success without publishing."
            exit 1
          fi
          # A prerelease version must not take the `latest` dist-tag.
          version=$(node -p "require('./dist/universal-cli/package.json').version")
          case "$version" in
            *-*) dist_tag="next" ;;
            *) dist_tag="latest" ;;
          esac
          echo "Publishing @next-mmo/universal-cli@$version with dist-tag $dist_tag"
          npm publish ./dist/universal-cli --access public --provenance --tag "$dist_tag"
      - name: Publish @next-mmo/nd-workflow
        if: github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set, so this release cannot publish. A tag push or a non-dry-run dispatch is a real release intent; refusing to report success without publishing."
            exit 1
          fi
          version=$(node -p "require('./packages/nd-workflow/package.json').version")
          case "$version" in
            *-*) dist_tag="next" ;;
            *) dist_tag="latest" ;;
          esac
          echo "Publishing @next-mmo/nd-workflow@$version with dist-tag $dist_tag"
          npm publish ./packages/nd-workflow/artifacts/nd-workflow.tgz --access public --provenance --tag "$dist_tag"
