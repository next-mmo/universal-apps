<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Portfolio CMS</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">Portfolio</a>
      <div class="nav-links">
        <a href="/">Public Site</a>
        <span id="user-info"></span>
        <button class="btn btn-secondary" id="logout-btn" style="display:none" onclick="logout()">Logout</button>
      </div>
    </nav>
  </header>
  <main class="admin-container">
    <div id="login-section" style="display:none">
      <div class="login-box">
        <h2>Admin Login</h2>
        <div id="login-error" class="alert alert-error" style="display:none"></div>
        <form id="login-form">
          <div class="form-group"><label>Username</label><input type="text" id="username" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
          <button type="submit" class="btn">Login</button>
        </form>
      </div>
    </div>
    <div id="dashboard" style="display:none">
      <h2>Dashboard</h2>
      <div style="margin-bottom:2rem">
        <button class="btn" onclick="showSection('projects')">Manage Projects</button>
        <button class="btn btn-secondary" onclick="showSection('posts')">Manage Posts</button>
      </div>
      <div id="projects-section" style="display:none">
        <h3>Projects</h3>
        <button class="btn" onclick="showForm('project')">+ New Project</button>
        <div id="project-form" style="display:none;margin-top:1rem">
          <div class="form-group"><label>Title</label><input id="proj-title"></div>
          <div class="form-group"><label>Description</label><textarea id="proj-desc"></textarea></div>
          <div class="form-group"><label>Tags (comma separated)</label><input id="proj-tags"></div>
          <div class="form-group"><label>Live URL</label><input id="proj-live"></div>
          <div class="form-group"><label>Repo URL</label><input id="proj-repo"></div>
          <button class="btn" onclick="saveProject()">Save</button>
          <button class="btn btn-secondary" onclick="hideForm('project')">Cancel</button>
        </div>
        <table class="admin-table"><thead><tr><th>Title</th><th>Tags</th><th>Actions</th></tr></thead><tbody id="proj-table"></tbody></table>
      </div>
      <div id="posts-section" style="display:none">
        <h3>Blog Posts</h3>
        <button class="btn" onclick="showForm('post')">+ New Post</button>
        <div id="post-form" style="display:none;margin-top:1rem">
          <div class="form-group"><label>Title</label><input id="post-title"></div>
          <div class="form-group"><label>Body</label><textarea id="post-body"></textarea></div>
          <div class="form-group"><label>Tags (comma separated)</label><input id="post-tags"></div>
          <div class="form-group"><label>Published</label><select id="post-published"><option value="false">Draft</option><option value="true">Published</option></select></div>
          <button class="btn" onclick="savePost()">Save</button>
          <button class="btn btn-secondary" onclick="hideForm('post')">Cancel</button>
        </div>
        <table class="admin-table"><thead><tr><th>Title</th><th>Status</th><th>Actions</th></tr></thead><tbody id="post-table"></tbody></table>
      </div>
    </div>
  </main>
  <script src="/js/admin.js"></script>
</body>
</html>
