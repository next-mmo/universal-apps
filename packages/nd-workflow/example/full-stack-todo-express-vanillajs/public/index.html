<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Small Wins — Todo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">WORKFLOW STARTER / LOCAL DEMO</p><h1>Small wins.<br>Steady progress.</h1><p class="intro">One task at a time. Saved on this machine.</p></header>
    <section class="board" aria-label="Todo board">
      <form id="add-form"><label for="new-title">What's next?</label><div class="entry"><input id="new-title" name="title" maxlength="200" placeholder="Write a focused task…" required autocomplete="off"><button type="submit">Add task</button></div></form>
      <div class="toolbar"><p id="count" aria-live="polite">Loading…</p><nav aria-label="Task filters"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="active" aria-pressed="false">Active</button><button type="button" data-filter="completed" aria-pressed="false">Completed</button></nav></div>
      <p id="error" role="alert" hidden></p><button id="retry" type="button" hidden>Retry loading</button>
      <p id="empty" hidden>No tasks here. Add a small win.</p>
      <ul id="todos" aria-label="Tasks"></ul>
      <p id="status" role="status" class="status"></p>
    </section>
    <footer>Express + vanilla JavaScript · single-process JSON storage · no account required</footer>
  </main>
</body>
</html>
